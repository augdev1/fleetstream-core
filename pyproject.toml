[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fleetstream-core"
version = "0.1.0"
description = "Local video distribution and orchestration engine for iPhone fleets managed via Tame.so"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "FleetStream Core Engineering Team" }
]
license = { text = "MIT" }
keywords = ["automation", "video-distribution", "orchestration", "round-robin", "tame-so", "iphone-fleet"]
dependencies = [
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "watchdog>=4.0.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "harness*"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests", "harness"]
pythonpath = ["."]
markers = [
    "unit: isolated unit tests",
    "integration: integration tests with filesystem sandbox",
    "resilience: concurrency, stress, and corruption tests",
    "harness: hermetic test harness suite",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = []

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
